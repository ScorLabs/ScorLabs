<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="ScorLabs 科研工作台本机预览入口。请先在当前设备启动服务；公网科研后端尚未部署。" />
    <meta name="robots" content="noindex, nofollow" />
    <title>ScorLabs Platform · 科研工作台</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: #dce1eb; background: #0a0c10; font-synthesis: none; }
      * { box-sizing: border-box; }
      body { margin: 0; font-size: 14px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
      header { height: 62px; display: flex; align-items: center; padding: 0 28px; border-bottom: 1px solid #252a34; }
      .brand { font-size: 15px; font-weight: 650; letter-spacing: -.2px; }
      .brand span { color: #8e98aa; font-size: 13px; font-weight: 450; margin-left: 10px; }
      main { width: min(680px, 100%); margin: 72px auto 0; padding: 0 28px 48px; }
      h1 { margin: 0 0 20px; color: #f0f2f6; font-size: 28px; line-height: 1.4; font-weight: 620; letter-spacing: -.5px; }
      p { margin: 0 0 13px; color: #a7afbf; }
      .actions { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; margin: 28px 0 13px; }
      a { color: #bdc7df; text-decoration: none; text-underline-offset: 5px; }
      a:hover { color: #f1f4ff; text-decoration: underline; }
      .primary { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 9px 18px; color: #f5f7ff; background: #535fd8; border: 1px solid #6c76df; border-radius: 6px; font-weight: 560; }
      .primary:hover { background: #626de1; text-decoration: none; }
      a:focus-visible { outline: 2px solid #a7baff; outline-offset: 5px; border-radius: 4px; }
      .help { font-size: 12px; color: #8c96a9; }
      code { font-family: Menlo, Monaco, Consolas, monospace; font-size: 12px; color: #b4bfd3; overflow-wrap: anywhere; }
      footer { margin-top: 34px; padding-top: 20px; border-top: 1px solid #252a34; }
      footer p { font-size: 12px; color: #8c96a9; }
      @media (max-width: 600px) { header { padding: 0 22px; } main { margin-top: 42px; padding-left: 22px; padding-right: 22px; } h1 { font-size: 25px; } .actions { gap: 18px; } }
    </style>
  </head>
  <body>
    <header><div class="brand">ScorLabs <span>Platform</span></div></header>
    <main>
      <h1>科研工作台</h1>
      <p>当前提供本机预览，公网科研后端尚未部署。</p>
      <p>请先在当前设备启动本机服务，再打开科研工作台。</p>
      <div class="actions">
        <a class="primary" href="http://127.0.0.1:8000" target="_blank" rel="noopener noreferrer" aria-describedby="local-help">打开本机工作台</a>
        <a href="https://scorlabs-ai.com/" target="_blank" rel="noopener noreferrer">访问 ScorLabs 官网</a>
      </div>
      <p class="help" id="local-help">本机地址：<code>http://127.0.0.1:8000</code>。此链接指向你当前使用的设备。</p>
      <p class="help">官网 HTTPS 证书配置中，若暂时无法验证，请稍后再访问。</p>
      <footer>
        <p>本页只提供入口说明，不接收 API 密钥或科研资料。</p>
      </footer>
    </main>
  </body>
</html>
